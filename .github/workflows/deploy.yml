name: Deploy

# Publica a imagem e atualiza o Swarm sempre que a main recebe codigo (ou quando
# alguem dispara manualmente pela aba Actions). Fluxo: compila -> testa -> so
# segue adiante se tudo passar -> builda imagem multi-arch -> publica no Docker
# Hub como latest e com uma tag datada (para voltar atras com
# DYALOG_IMAGE_TAG) -> atualiza o servico no Swarm. O rollback em caso de falha
# de saude e feito pelo proprio Swarm (update_config failure_action: rollback).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compilar
        run: go build ./...

      - name: Rodar testes
        run: go test ./...

      - name: Conferir ajuste do whatsmeow
        run: go run ./tools/whatsmeow-overlay /tmp/whatsmeow

      - name: Tag datada
        id: tag
        run: echo "datada=$(TZ=America/Manaus date +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar QEMU (para build arm64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            aliffstefano/dyalog-api:latest
            aliffstefano/dyalog-api:${{ steps.tag.outputs.datada }}

      - name: Atualizar servico no Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SWARM_SSH_HOST }}
          username: ${{ secrets.SWARM_SSH_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          script: |
            docker pull aliffstefano/dyalog-api:latest
            docker service update --force --image aliffstefano/dyalog-api:latest --with-registry-auth dyalog-api_dyalog-api

      - name: Resumo
        if: always()
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem: aliffstefano/dyalog-api:latest e :${{ steps.tag.outputs.datada }}" >> "$GITHUB_STEP_SUMMARY"
